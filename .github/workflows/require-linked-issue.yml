name: Require Linked Issue

# Fails the PR check if the PR description does not reference an issue
# (e.g. "Closes #12", "Fixes #12", "Resolves #12", or "#12"), or if that
# issue has not been labeled "plan-approved" (HITL plan approval gate).
# This runs on pull_request_target so the issue label check executes with the
# repository's base permissions, and includes label events so approval actions
# retrigger the required check.
on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened, labeled]
  issues:
    types: [labeled]

jobs:
  check-linked-issue:
    permissions:
      issues: read
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR references an approved-plan issue
        uses: actions/github-script@v7
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        with:
          script: |
            const body = process.env.PR_BODY || "";
            const crossRepoMatch = body.match(/\b[^/\s]+\/[^\s#]+#\d+\b/i);
            if (crossRepoMatch) {
              core.setFailed(`Cross-repository reference "${crossRepoMatch[0]}" is not supported. Every PR must reference an issue in this repository (e.g. 'Closes #123').`);
              return;
            }
            const match =
              body.match(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/i) ||
              body.match(/(?:^|[\s(])#(\d+)\b/);
            if (!match) {
              core.setFailed("No linked issue found in the PR description. Every PR must reference an issue (e.g. 'Closes #123').");
              return;
            }
            const issueNumber = parseInt(match[1], 10);
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            if (issue.pull_request) {
              core.setFailed(`Linked reference #${issueNumber} is a pull request. Every PR must reference an issue with the "plan-approved" label.`);
              return;
            }
            const labels = issue.labels.map((label) => (typeof label === "string" ? label : label.name));
            const hasLabel = labels.includes("plan-approved");
            if (!hasLabel) {
              core.setFailed(`Linked issue #${issueNumber} is missing the "plan-approved" label. The plan must be approved (HITL) before execution/PR.`);
              return;
            }
            core.info(`Linked issue #${issueNumber} has an approved plan.`);

  refresh-linked-pr-check:
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'plan-approved'
    permissions:
      issues: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Refresh validation for linked pull requests
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const refreshLabel = "plan-validation-refresh";
            const pullRequests = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              base: "main",
              per_page: 100,
            });
            const issueReference = new RegExp(`(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\\s+#${issueNumber}\\b|#${issueNumber}\\b`, "i");
            const linkedPullRequests = pullRequests.filter((pullRequest) => issueReference.test(pullRequest.body || ""));

            if (linkedPullRequests.length === 0) {
              core.info(`No open pull requests reference issue #${issueNumber}.`);
              return;
            }

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: refreshLabel,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: refreshLabel,
                color: "1d76db",
                description: "Refreshes linked issue validation after plan approval",
              });
            }

            for (const pullRequest of linkedPullRequests) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pullRequest.number,
                  name: refreshLabel,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                labels: [refreshLabel],
              });
              core.info(`Refreshed validation for PR #${pullRequest.number}.`);
            }
